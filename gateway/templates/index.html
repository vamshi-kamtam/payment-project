
<!DOCTYPE html>
<html>
<head>
    <title>Payment Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 50px;
        }
        .dashboard {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }
        button {
            padding: 14px 22px;
            margin: 12px;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .user { background: #16a34a; }
        .payment { background: #2563eb; }
        pre {
            text-align: left;
            background: #111827;
            color: #86efac;
            padding: 20px;
            border-radius: 8px;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Payment Dashboard</h1>
        <p>Choose a service to send a request through API Gateway.</p>

        <button class="user" onclick="getUser()">
            Get User Details
        </button>

        <button class="payment" onclick="makePayment()">
            Make Payment
        </button>

        <h3>Service Response</h3>
        <pre id="result">Waiting for your request...</pre>
    </div>

    <script>
        async function getUser() {
            const result = document.getElementById("result");
            result.textContent = "Calling User Service...";

            try {
                const response = await fetch("/api/users/101");
                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        }

        async function makePayment() {
            const result = document.getElementById("result");
            result.textContent = "Calling Payment Service...";

            try {
                const response = await fetch("/api/payments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_id: 101,
                        amount: 1000
                    })
                });

                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
